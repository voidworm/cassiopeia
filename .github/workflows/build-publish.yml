name: Build and Publish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE=$(git rev-list --max-parents=0 HEAD)
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER")
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q '^cassiopeia-frontend/'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$CHANGED" | grep -q '^cassiopeia-backend/'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

  frontend:
    needs: [changes, backend]
    if: always() && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: version
        name: Compute next version
        run: |
          CURRENT=$(grep 'tag:' cassiopeia-cluster/frontend/values.yaml | awk '{print $2}')
          NUM=${CURRENT#v}
          NEXT="v$((NUM + 1))"
          echo "Bumping frontend $CURRENT -> $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./cassiopeia-frontend
          push: true
          provenance: false
          tags: fogshaper/cassiopeia-frontend:${{ steps.version.outputs.next }}

      - name: Bump values.yaml and commit
        run: |
          sed -i "s/tag: .*/tag: ${{ steps.version.outputs.next }}/" cassiopeia-cluster/frontend/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cassiopeia-cluster/frontend/values.yaml
          git commit -m "chore(frontend): bump image tag to ${{ steps.version.outputs.next }}"
          git pull --rebase origin main
          git push origin HEAD:main

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - id: version
        name: Compute next version
        run: |
          CURRENT=$(grep 'tag:' cassiopeia-cluster/backend/values.yaml | awk '{print $2}')
          NUM=${CURRENT#v}
          NEXT="v$((NUM + 1))"
          echo "Bumping backend $CURRENT -> $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./cassiopeia-backend
          push: true
          provenance: false
          tags: fogshaper/cassiopeia-backend:${{ steps.version.outputs.next }}

      - name: Bump values.yaml and commit
        run: |
          sed -i "s/tag: .*/tag: ${{ steps.version.outputs.next }}/" cassiopeia-cluster/backend/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cassiopeia-cluster/backend/values.yaml
          git commit -m "chore(backend): bump image tag to ${{ steps.version.outputs.next }}"
          git pull --rebase origin main
          git push origin HEAD:main
