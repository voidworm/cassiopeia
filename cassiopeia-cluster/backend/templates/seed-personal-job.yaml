apiVersion: batch/v1
kind: Job
metadata:
  name: cassiopeia-backend-seed-personal
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed-personal
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["seed", "personal"]
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@cassiopeia-postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
