apiVersion: batch/v1
kind: Job
metadata:
  name: cassiopeia-backend-seed-initial
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed-initial
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["seed", "initial"]
          env:
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@cassiopeia-postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
