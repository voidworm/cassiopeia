apiVersion: apps/v1
kind: Deployment
metadata:
  name: cassiopeia-backend
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: cassiopeia-backend
  template:
    metadata:
      labels:
        app: cassiopeia-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8080
          env:
{{- if .Values.externalSecrets.enabled }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cassiopeia-backend-db
                  key: user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cassiopeia-backend-db
                  key: password
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: cassiopeia-backend-db
                  key: database
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@cassiopeia-postgres:5432/$(DB_NAME)?sslmode=disable"
{{- else }}
            - name: DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@cassiopeia-postgres:5432/{{ .Values.postgres.database }}?sslmode=disable"
{{- end }}
            - name: PORT
              value: "8080"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: cassiopeia-backend
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: cassiopeia-backend
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
